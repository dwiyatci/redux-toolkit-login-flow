name: Setup pnpm and Node.js

runs:
  using: composite
  steps:
    - name: Read pinned tool versions
      id: versions
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null || { echo 'jq is required to read package.json versions' >&2; exit 1; }
        pnpm_version="$(jq -er '.packageManager | sub("^pnpm@"; "") | sub("\\+.*$"; "") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json)"
        node_version="$(jq -er '.volta.node | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json)"
        printf 'pnpm-version=%s\nnode-version=%s\n' "$pnpm_version" "$node_version" >> "$GITHUB_OUTPUT"
    - uses: pnpm/setup@v3
      with:
        version: ${{ steps.versions.outputs.pnpm-version }}
        runtime: node@${{ steps.versions.outputs.node-version }}
        install: false
